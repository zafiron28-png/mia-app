name: Compilar APK desde ZIP

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Descomprimir cualquier archivo ZIP
        run: |
          mkdir -p android_project
          unzip *.zip -d android_project/

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Buscar gradlew y compilar APK
        run: |
          # Encuentra dónde está el archivo gradlew dentro de lo descomprimido
          GRADLE_DIR=$(find android_project -name "gradlew" -exec dirname {} \;)
          echo "Directorio de Gradle encontrado en: $GRADLE_DIR"
          cd "$GRADLE_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Subir APK generado
        uses: actions/upload-artifact@v4
        with:
          name: mia-app-debug
          path: '**/build/outputs/apk/debug/app-debug.apk'
