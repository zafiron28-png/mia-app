name: Compilar APK desde ZIP

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Descomprimir proyecto
        run: |
          # Cambia 'proyecto.zip' si tu archivo tiene otro nombre exacto
          unzip proyecto.zip -d android_project

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Dar permisos y compilar APK
        run: |
          cd android_project
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Subir APK generado
        uses: actions/upload-artifact@v4
        with:
          name: mia-app-debug
          path: android_project/app/build/outputs/apk/debug/app-debug.apk

