name: Compilar APK desde ZIP

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar unzip y crear directorio
        run: |
          sudo apt-get update && sudo apt-get install -y unzip
          mkdir -p android_project

      - name: Descomprimir archivo ZIP
        run: |
          # Encuentra cualquier archivo .zip en la raiz y lo descomprime
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          echo "Archivo ZIP encontrado: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d android_project/

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Buscar gradlew y compilar APK
        run: |
          GRADLE_DIR=$(find android_project -name "gradlew" -exec dirname {} \; | head -n 1)
          if [ -z "$GRADLE_DIR" ]; then
            echo "Error: No se encontró gradlew dentro del archivo ZIP."
            exit 1
          fi
          echo "Directorio con Gradle: $GRADLE_DIR"
          cd "$GRADLE_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Subir APK generado
        uses: actions/upload-artifact@v4
        with:
          name: mia-app-debug
          path: '**/build/outputs/apk/debug/app-debug.apk'
